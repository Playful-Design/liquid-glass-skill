const c=document.querySelector('canvas'),g=c.getContext('webgl',{antialias:true});const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;const fs=`precision highp float;uniform vec3 iResolution;uniform float iTime;float curve(vec2 p,float w,float y,float r){float x=clamp(p.x,-w,w);return length(p-vec2(x,y-.31*x*x-.105*x))-r;}

float h=heightAt(p),eps=.004;vec2 grad=vec2(heightAt(p+vec2(eps,0.))-heightAt(p-vec2(eps,0.)),heightAt(p+vec2(0.,eps))-heightAt(p-vec2(0.,eps)))/(2.*eps);vec3 n=normalize(vec3(-grad,1.));vec3 v=normalize(vec3(-p*.12,2.2-h*.18));float nv=clamp(dot(n,v),.001,1.);float fresnel=.04+.96*pow(1.-nv,5.);
